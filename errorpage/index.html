<html lang="fr">

<!-- Thème "Nuit en altitude" repris de ~/dev/portfolio/styles.css. Page autonome : servie pour n'importe quel domaine, sans asset local. -->
<style>
  :root {
    color-scheme: light dark;
    --night-0: light-dark(#FBFDFF, #070B14);
    --night-1: light-dark(#EFF4FA, #0B101C);
    --snow: light-dark(#16202E, #EDF1F8);
    --mist: light-dark(#4C5B70, #97A3B8);
    --dawn: light-dark(#AC5018, #E8A16E);
    --dawn-bright: light-dark(#9C4712, #F0B285);
    --ice: light-dark(#33689E, #9CC3E8);
    --hairline: light-dark(rgba(22, 32, 46, 0.14), rgba(151, 163, 184, 0.16));
    --border-ui: light-dark(rgba(22, 32, 46, 0.55), rgba(151, 163, 184, 0.6));
    --star-color: light-dark(transparent, #EDF1F8);
    --glow-dawn: light-dark(rgba(172, 80, 24, 0.16), rgba(232, 161, 110, 0.22));
    --glow-dawn-strong: light-dark(rgba(172, 80, 24, 0.26), rgba(232, 161, 110, 0.32));
    --glow-dot: light-dark(rgba(172, 80, 24, 0.5), rgba(232, 161, 110, 0.8));
    --sky-warm: light-dark(rgba(172, 80, 24, 0.07), rgba(232, 161, 110, 0.07));
    --sky-ice: light-dark(rgba(51, 104, 158, 0.09), rgba(156, 195, 232, 0.05));
    --font-display: 'Clash Display', 'Helvetica Neue', sans-serif;
    --font-body: 'Satoshi', 'Helvetica Neue', sans-serif;
    --font-mono: 'JetBrains Mono', 'SFMono-Regular', Consolas, monospace;
    --gutter: clamp(16px, 5vw, 2.5rem);
    --ease: cubic-bezier(0.22, 1, 0.36, 1);
  }
  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    min-height: 100vh; min-height: 100svh;
    display: flex; flex-direction: column;
    font: 400 17px/1.7 var(--font-body);
    color: var(--snow);
    background:
      radial-gradient(ellipse 80% 55% at 72% 88%, var(--sky-warm), transparent 60%),
      radial-gradient(ellipse 70% 60% at 25% 10%, var(--sky-ice), transparent 65%),
      linear-gradient(to bottom, var(--night-0), var(--night-1));
    background-color: var(--night-1);
    -webkit-font-smoothing: antialiased;
    overflow-x: hidden;
  }
  ::selection { background-color: var(--dawn); color: var(--night-0); }
  :focus-visible { outline: 2px solid var(--ice); outline-offset: 3px; border-radius: 2px; }

  .stars { position: fixed; inset: 0 0 30% 0; pointer-events: none; }
  .star { position: absolute; border-radius: 50%; background: var(--star-color);
          opacity: var(--o, .4); animation: twinkle 4s ease-in-out infinite; }
  @keyframes twinkle { 50% { opacity: calc(var(--o, .4) * .25); } }

  main { flex: 1; display: flex; flex-direction: column; justify-content: center;
         width: 100%; max-width: 760px; margin: 0 auto; padding: 6rem var(--gutter) 3rem; position: relative; z-index: 1; }
  .mono { font-family: var(--font-mono); font-size: .72rem; letter-spacing: .16em; text-transform: uppercase; }
  .coords { color: var(--ice); margin-bottom: 2rem; overflow-wrap: anywhere; }
  h1 { font: 600 clamp(2.6rem, 8vw, 5rem)/1 var(--font-display); letter-spacing: -.02em; margin-bottom: 2rem; }
  h1 span { display: block; overflow: hidden; }
  h1 span > span { transform: translateY(110%); animation: lineUp 1s var(--ease) .15s forwards; }
  h1 span:nth-child(2) > span { animation-delay: .28s; color: var(--dawn); }
  @keyframes lineUp { to { transform: none; } }
  p.lead { color: var(--mist); font-size: clamp(1.05rem, 1.4vw, 1.2rem); line-height: 1.75; max-width: 480px; margin-bottom: 2rem; text-wrap: pretty; }
  .avail { display: flex; align-items: center; gap: .6rem; color: var(--mist); letter-spacing: .12em; margin-bottom: 1rem; }
  .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--dawn); box-shadow: 0 0 8px var(--glow-dot); animation: pulse 2.4s ease-in-out infinite; }
  @keyframes pulse { 50% { opacity: .35; } }
  .actions { display: flex; flex-wrap: wrap; gap: 1rem; }
  .btn { display: inline-block; font: 500 .82rem/1 var(--font-body); letter-spacing: .05em; text-transform: uppercase; text-decoration: none;
         padding: 1rem 2rem; border: 1px solid transparent; border-radius: 6px; cursor: pointer;
         transition: background-color .4s var(--ease), border-color .4s var(--ease), box-shadow .4s var(--ease), transform .4s var(--ease); }
  .btn:active { transform: scale(.98); }
  .btn--primary { background: var(--dawn); border-color: var(--dawn); color: var(--night-0); font-weight: 700; box-shadow: 0 0 32px var(--glow-dawn); }
  .btn--primary:hover { background: var(--dawn-bright); border-color: var(--dawn-bright); box-shadow: 0 0 42px var(--glow-dawn-strong); }
  .btn--ghost { background: transparent; color: var(--snow); border-color: var(--border-ui); }
  .btn--ghost:hover { border-color: var(--snow); }

  .ridge { position: relative; }
  .ridge svg { display: block; width: 100%; height: clamp(90px, 16vh, 170px); overflow: visible; }
  .ridge-line { stroke: var(--dawn); stroke-width: 1.5; clip-path: inset(0 100% 0 0); animation: wipe 2.6s var(--ease) .5s forwards; }
  /* ponytail: le tracé s'arrête au milieu, comme un coureur au ravito ; la suite reste en pointillés glacier */
  .ridge-rest { stroke: var(--ice); stroke-opacity: .35; stroke-width: 1; stroke-dasharray: 4 6; }
  .ridge-echo { stroke: var(--ice); stroke-opacity: .12; stroke-width: 1; transform: translateY(8px); }
  @keyframes wipe { to { clip-path: inset(0 52% 0 0); } }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: 0s !important; animation-delay: 0s !important; }
  }
  @media (max-width: 520px) { .btn { flex: 1 1 100%; text-align: center; } }
</style>
</head>
<body>
<div class="stars" aria-hidden="true"></div>
<main>
  <p class="mono coords" id="where">Service indisponible</p>
  <h1><span><span>Pause</span></span><span><span>au ravito.</span></span></h1>
  <p class="lead">Ce site est en maintenance ou en train de redémarrer. Il reprend la course dans quelques minutes.</p>
  <p class="mono avail"><span class="dot" aria-hidden="true"></span>Ravitaillement en cours</p>
  <div class="actions">
    <a class="btn btn--primary" href="" onclick="location.reload(); return false;">Réessayer</a>
    <a class="btn btn--ghost" href="https://bsrd.fr">Retour à bsrd.fr</a>
  </div>
</main>

<script>
  // Domaine demandé dans la ligne mono, étoiles comme sur bsrd.fr
  if (location.hostname) document.getElementById('where').textContent = location.hostname + '  ·  Service indisponible';
  var box = document.querySelector('.stars');
  for (var i = 0; i < 70; i++) {
    var s = document.createElement('span'), z = (Math.random() * 1.6 + .6).toFixed(1) + 'px';
    s.className = 'star'; s.style.width = s.style.height = z;
    s.style.left = Math.random() * 100 + '%'; s.style.top = Math.random() * 100 + '%';
    s.style.animationDelay = (Math.random() * 4).toFixed(2) + 's';
    s.style.setProperty('--o', (.2 + Math.random() * .5).toFixed(2));
    box.appendChild(s);
  }
</script>
