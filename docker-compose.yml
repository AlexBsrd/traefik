services:
  traefik:
    image: traefik:v3.7
    container_name: traefik
    restart: unless-stopped
    # 60 s entre deux sondes pour ménager le NVMe ; 5 s au démarrage pour que Traefik route vite
    healthcheck:
      test: ["CMD", "traefik", "healthcheck", "--ping"]
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 60s
      start_interval: 5s
    command:
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --providers.file.directory=/etc/traefik/dynamic
      - --providers.file.watch=true
      - --entrypoints.web.address=:80
      - --entrypoints.websecure.address=:443
      - --entrypoints.websecure.http.middlewares=errorpages@file,security-headers@file,compress@file
      - --entrypoints.web.http.redirections.entryPoint.to=websecure
      - --entrypoints.web.http.redirections.entryPoint.scheme=https
      - --certificatesresolvers.letsencrypt.acme.email=alexbroussard@hotmail.fr
      - --certificatesresolvers.letsencrypt.acme.storage=/letsencrypt/acme.json
      - --certificatesresolvers.letsencrypt.acme.httpchallenge.entrypoint=web
      - --ping=true
      - --accesslog=true
      - --accesslog.filepath=/var/log/traefik/access.log
      - --accesslog.format=json
      - --accesslog.bufferingsize=100
      - --accesslog.fields.headers.defaultmode=keep
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - letsencrypt:/letsencrypt
      - ./dynamic:/etc/traefik/dynamic:ro
      - traefik-logs:/var/log/traefik
    networks:
      proxy:
        ipv4_address: 172.20.0.254

  # Page "site indisponible" servie par Traefik (voir dynamic/errorpage.yml)
  errorpage:
    image: nginx:alpine
    container_name: errorpage
    restart: unless-stopped
    volumes:
      - ./errorpage/index.html:/usr/share/nginx/html/index.html:ro
      - ./errorpage/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - proxy

volumes:
  letsencrypt:
    name: traefik-letsencrypt
  traefik-logs:
    name: traefik-logs

networks:
  proxy:
    name: proxy
    external: true
